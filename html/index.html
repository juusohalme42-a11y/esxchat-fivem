<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jube Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="chat">
    <section id="messages"></section>
    <section id="suggestions"></section>
    <section id="inputBox">
      <span class="inputIcon">💬</span>
      <input id="chatInput" maxlength="500" autocomplete="off" spellcheck="false"
             placeholder="Kirjoita viesti tai /komento...">
      <span class="enterHint">ENTER ↵</span>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
